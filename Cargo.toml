[workspace]
resolver = "3"
# The fuzzing harness is not a member: `cargo-fuzz` needs nightly and `libfuzzer-sys`, and a member
# would pull both into every `cargo build` and into the MSRV job, which builds on 1.88.0 stable.
exclude = ["fuzz"]

members = [
    "crates/brolga-api",
    "crates/brolga-cli",
    "crates/brolga-config",
    "crates/brolga-connectors",
    "crates/brolga-export",
    "crates/brolga-graph",
    "crates/brolga-ingest",
    "crates/brolga-model",
    "crates/brolga-plugin-host",
    "crates/brolga-plugin-sdk",
    "crates/brolga-security",
    "crates/brolga-storage",
]

# Shared metadata. ADR 0001 §4 pins edition 2024 and Rust stable; ADR 0002 amends its MSRV clause
# and raises the floor to 1.88.0, which is the `rust-version` below.
# ADR 0001 §6 makes the workspace version one compatibility surface among several; it does not
# imply the schema version or any migration id.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/jusso-dev/Brolga"
homepage = "https://github.com/jusso-dev/Brolga"
authors = ["Brolga contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Deny the categories that hide correctness and denial-of-service problems in code that parses
# untrusted intelligence. A panic on hostile input is a bug, not a diagnostic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
