# Standalone plugin guest — not a workspace member (needs wasm32 + cargo-component).
[package]
name = "echo-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Minimal pure-compute Brolga plugin component (fixture)"

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "brolga:echo-guest"
# Match crates/brolga-plugin-sdk/wit/world.wit
target = { path = "wit/world.wit", world = "plugin" }

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"
