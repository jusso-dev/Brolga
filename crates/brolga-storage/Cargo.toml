[package]
name = "brolga-storage"
description = "Backend-neutral storage traits, migrations, and the SQLite backend for Brolga"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["database"]

[lints]
workspace = true

[dependencies]
brolga-model = { version = "0.1.0", path = "../brolga-model" }
# Pinned below the newest release on purpose. `rusqlite` 0.40 requires
# `libsqlite3-sys` 0.38.1, whose build script uses `cfg_select!` and therefore needs a
# compiler newer than the 1.88.0 floor ADR 0002 declares. `libsqlite3-sys` does not publish a
# `rust-version`, so Cargo's MSRV-aware resolution cannot see the conflict — the pinned CI job
# is what caught it, which is the reason that job exists.
#
# Raising the MSRV a second time in one milestone to satisfy a build script would be chasing the
# ecosystem rather than making a decision. Revisit when the floor moves for a reason of its own.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
# Pinned below the newest release on purpose. `rusqlite` 0.40 requires
# `libsqlite3-sys` 0.38.1, whose build script uses `cfg_select!` and therefore needs a
# compiler newer than the 1.88.0 floor ADR 0002 declares. `libsqlite3-sys` does not publish a
# `rust-version`, so Cargo's MSRV-aware resolution cannot see the conflict — the pinned CI job
# is what caught it, which is the reason that job exists.
#
# Raising the MSRV a second time in one milestone to satisfy a build script would be chasing the
# ecosystem rather than making a decision. Revisit when the floor moves for a reason of its own.
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.27.0"
