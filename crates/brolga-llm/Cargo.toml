[package]
name = "brolga-llm"
description = "Optional, disabled-by-default language-model proposal providers for Brolga"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["api-bindings"]
keywords = ["threat-intelligence", "llm", "openai", "proposal"]

[lints]
workspace = true

[features]
default = []
# Compiles HTTP adapters (ureq). Off by default — ADR 0001 §3, ADR 0010.
http = ["dep:ureq"]

[dependencies]
brolga-config = { version = "0.1.0", path = "../brolga-config" }
brolga-model = { version = "0.1.0", path = "../brolga-model" }
brolga-security = { version = "0.1.0", path = "../brolga-security" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
serde_json = "1.0.151"
