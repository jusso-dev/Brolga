# Secret references.
#
# Both forms name a location. Neither contains a value, and there is no third
# form that does — a bare string is rejected at parse time with a message saying
# what to write instead.
version: 1

secrets:
  # Read from the process environment.
  feed_token:
    from_env: BROLGA_FEED_TOKEN
  # Read from a file, typically a mounted secret. `..` components are rejected.
  upstream_key:
    from_file: /run/secrets/upstream-key
