[package]
name = "brolga-graph"
description = "Deduplication, resolution, contradiction, decay, traversal, and checkpoints for Brolga"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["algorithms"]

[lints]
workspace = true

[dependencies]
brolga-config = { version = "0.1.0", path = "../brolga-config" }
brolga-model = { version = "0.1.0", path = "../brolga-model" }
brolga-security = { version = "0.1.0", path = "../brolga-security" }
brolga-storage = { version = "0.1.0", path = "../brolga-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
proptest = "1.11.0"
brolga-storage = { version = "0.1.0", path = "../brolga-storage" }
# Only for the test double that stands in for a concurrent import: `StoreRead` returns
# `serde_json::Value` from its raw-document readers, so delegating them needs the type in scope.
serde_json = "1.0.151"
tempfile = "3.27.0"
