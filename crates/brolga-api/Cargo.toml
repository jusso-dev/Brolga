[package]
name = "brolga-api"
description = "Versioned local HTTP API over a Brolga store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
brolga-model = { version = "0.1.0", path = "../brolga-model" }
brolga-security = { version = "0.1.0", path = "../brolga-security" }
brolga-storage = { version = "0.1.0", path = "../brolga-storage" }

axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3.54", features = ["std"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "net",
    "rt",
    "signal",
    "time",
] }
tower = { version = "0.5", default-features = false, features = ["timeout"] }
tower-http = { version = "0.6", default-features = false, features = [
    "limit",
    "timeout",
] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
brolga-ingest = { version = "0.1.0", path = "../brolga-ingest" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
