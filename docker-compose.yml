# Brolga in a homelab.
#
# Two shapes, deliberately separated into two services over one volume:
#
#   `brolga`      a command that runs and exits. `docker compose run --rm brolga <command>`.
#                 No network, because ingestion makes no outbound connection.
#   `brolga-api`  the read-only HTTP API, for services that pull context from Brolga. Started
#                 with `docker compose --profile serve up -d`.
#
# They are separate services rather than one, because almost everything that is right for a
# command that exits is wrong for a daemon: the restart policy, the network, and whether a
# healthcheck means anything. See docs/DEPLOYMENT.md and docs/API.md.

name: brolga

services:
  brolga:
    build:
      context: .
      dockerfile: Dockerfile
    image: brolga:local

    # `no`, not `unless-stopped`. A restart policy exists to bring a crashed daemon back; applied
    # to a command that is *supposed* to exit, it reads a successful run as a fault and restarts
    # it for ever. An operator who wants Brolga to run on a schedule should use the host's
    # scheduler — there is nothing inside Brolga that polls or fetches on a timer.
    restart: "no"

    # What a bare `docker compose up` should do: report whether this installation can do its job,
    # then stop. Exits 0 when every check passes and 3 otherwise.
    command: ["doctor"]

    volumes:
      # The database and any configuration file. A named volume rather than a bind mount: SQLite
      # wants POSIX locking to behave, and a bind mount into a Docker VM on macOS or Windows is
      # the classic way to find out that it does not.
      - brolga-data:/data
      # Operator drop directory. Mounted at /feeds-host (not /feeds) so an empty remote bind —
      # common with Docker contexts over SSH — does not hide the demo files baked into the image
      # at /feeds/demo-*.json. Local operators: `ingest /feeds-host/your-bundle.json`.
      - ./feeds:/feeds-host:ro

    # File ingest makes no outbound connections. Keep network off for the default CLI service so
    # a misconfigured fetch cannot surprise you. For `brolga fetch`, run a one-off container with
    # a network, or compose with docker-compose.postgres.yml (which resets network_mode).
    network_mode: "none"

    # Everything writable is either the volume or a tmpfs, so the image layers can be read-only.
    read_only: true
    tmpfs:
      # SQLite falls back to temporary files for large sorts and for some statement journals.
      - /tmp

    # The binary needs no privileged capability at all: it opens files and writes a database.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

    # A parser handling untrusted input is exactly where a resource bound belongs. These are
    # deliberately generous for a homelab and are the ceiling, not the expectation; Brolga
    # applies its own limits from configuration well below them.
    mem_limit: 2g
    pids_limit: 256

  # ---------------------------------------------------------------------------------------------
  # The read-only HTTP API.
  # ---------------------------------------------------------------------------------------------
  brolga-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: brolga:local

    # Behind a profile, so `docker compose up` still runs `doctor` and exits. Starting a daemon
    # because someone typed `up` is not what an operator reading this file would expect.
    profiles: ["serve"]

    # `unless-stopped` is right *here* and wrong for the service above: this one is supposed to
    # stay running, so a crash is a fault worth recovering from.
    restart: unless-stopped

    # Bound to every interface *inside the container*, which is what makes it reachable through
    # the published port below. The container's network namespace is the boundary here, not the
    # bind address — and the token is what actually protects it, which is why the server refuses
    # to start on a reachable address without one.
    command: ["serve", "--bind", "0.0.0.0:8787", "--database", "/data/brolga.sqlite"]

    environment:
      # Required. There is no default and no fallback: the server exits 3 rather than starting
      # without one, so a missing token is a failed deployment rather than an open database.
      BROLGA_API_TOKEN: ${BROLGA_API_TOKEN:?set BROLGA_API_TOKEN to a token of at least 16 characters}

    ports:
      # Bound to the host's loopback by default. An operator who wants other machines to reach it
      # should say so explicitly by setting BROLGA_API_BIND to 0.0.0.0 — publishing to every
      # interface is not something to do because a default did it quietly.
      - "${BROLGA_API_BIND:-127.0.0.1}:8787:8787"

    volumes:
      # The same volume the command-line service writes to. Read-only would be better, but SQLite
      # needs to write its WAL and shared-memory files even to read.
      - brolga-data:/data

    healthcheck:
      # `/health` and not `/ready`: a liveness check that fails because a query is slow makes
      # Docker restart a process that was working.
      test: ["CMD", "/usr/local/bin/brolga", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 1g
    pids_limit: 256

volumes:
  # Referred to elsewhere as `brolga_brolga-data`: Compose prefixes the project name from the
  # `name:` key above.
  brolga-data:
