# Threat-feed lab — issue #60.
# Profiles: fixtures (default demo path), postgres (optional store).
#
# Images bake fixtures + scripts so this works against a remote Docker context
# (bind-mounting Mac paths into a remote engine fails).
name: brolga-lab

services:
  feed-simulator:
    profiles: ["fixtures"]
    build:
      context: .
      dockerfile: Dockerfile.feed-simulator
    image: brolga-feed-simulator:lab
    restart: "no"
    # Lab-internal only; not published to the host by default.
    expose:
      - "80"
    # nginx needs writable pid/cache paths (tmpfs below); root stays read-only.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /var/log/nginx
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
    pids_limit: 64

  brolga:
    profiles: ["fixtures"]
    build:
      context: .
      dockerfile: Dockerfile
      # Requires brolga:lab (or brolga:local) already built from repo root Dockerfile.
    image: brolga-lab:fixtures
    restart: "no"
    command: ["doctor"]
    volumes:
      - brolga-data:/data
      - lab-output:/output
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 2g
    pids_limit: 256

  ingest-once:
    profiles: ["fixtures"]
    image: brolga-lab:fixtures
    restart: "no"
    depends_on:
      brolga:
        condition: service_completed_successfully
      feed-simulator:
        condition: service_started
    volumes:
      - brolga-data:/data
      - lab-output:/output
    entrypoint: ["/bin/sh", "/scripts/ingest-once.sh"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 2g
    pids_limit: 256

  demo:
    profiles: ["fixtures"]
    image: brolga-lab:fixtures
    restart: "no"
    depends_on:
      ingest-once:
        condition: service_completed_successfully
    volumes:
      - brolga-data:/data
      - lab-output:/output
    entrypoint: ["/bin/sh", "/scripts/demo.sh"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 1g
    pids_limit: 128

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: brolga
      POSTGRES_PASSWORD: ${BROLGA_POSTGRES_PASSWORD:-lab-only-not-a-secret}
      POSTGRES_DB: brolga
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brolga -d brolga"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    pids_limit: 128

volumes:
  brolga-data:
  pg-data:
  lab-output:
